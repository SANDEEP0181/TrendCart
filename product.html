<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="View product details, available sizes, price, stock and reviews on TrendCart."><link rel="manifest" href="site.webmanifest"><link rel="stylesheet" href="style.css?v=20260907-7"><title>Product Details — TrendCart</title><style>.product-detail{max-width:1100px;margin:32px auto;padding:0 18px}.detail-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:start}.detail-image{min-height:420px;border-radius:22px;display:grid;place-items:center;background:#f6f7f9;overflow:hidden;font-size:110px}.detail-image img{width:100%;height:100%;max-height:560px;object-fit:contain}.detail-info h1{font-size:clamp(28px,4vw,44px);margin:8px 0}.detail-price{font-size:30px;font-weight:800;margin:14px 0}.detail-meta{color:#667085;margin:8px 0}.detail-sizes{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 20px}.detail-sizes label{cursor:pointer}.detail-sizes input{position:absolute;opacity:0}.detail-sizes span{display:inline-block;border:1px solid #d0d5dd;border-radius:10px;padding:9px 14px;background:#fff}.detail-sizes input:checked+span{border-color:#111827;background:#111827;color:#fff}.detail-actions{display:flex;gap:10px;flex-wrap:wrap}.detail-actions button,.detail-actions a{min-width:150px}.rating-big{font-size:20px;margin:10px 0}.back-link{display:inline-block;margin-bottom:18px}.detail-section{margin-top:38px}.error{padding:30px;text-align:center}.related-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.mini-card{border:1px solid #e5e7eb;border-radius:16px;padding:14px}.mini-card img{width:100%;height:180px;object-fit:contain;background:#f8f8f8;border-radius:12px}.mini-card h3{font-size:16px}.mini-card .price{font-weight:800}.muted{color:#667085}@media(max-width:760px){.detail-wrap{grid-template-columns:1fr;gap:22px}.detail-image{min-height:300px}.related-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.related-grid{grid-template-columns:1fr}.detail-actions>*{width:100%}}</style></head><body><header><a class="logo" href="index.html" aria-label="TrendCart home"><img src="assets/trendcart-logo.svg" alt="TrendCart"></a><nav><a href="index.html#products">Shop</a><a href="track-order.html">Track Order</a><a href="wishlist.html">♡ Wishlist <span id="wishlistCount">0</span></a><a href="cart.html">🛒 Cart <span id="cartCount">0</span></a><a href="account.html">👤 Account</a></nav></header><main class="product-detail"><a class="back-link" href="index.html#products">← Back to Shop</a><div id="productRoot"><p class="loading">Loading product...</p></div><section class="detail-section"><h2>You may also like</h2><div id="related" class="related-grid"><p class="muted">Loading...</p></div></section></main><footer><b>TrendCart</b><span>Simple shopping. Trending choices.</span></footer><script>const API='https://trendcart-wozq.onrender.com',KEY='trendcart_cart',WKEY='trendcart_wishlist',RKEY='trendcart_reviews',VKEY='trendcart_recently_viewed';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const cart=()=>JSON.parse(localStorage.getItem(KEY)||'[]');const wish=()=>JSON.parse(localStorage.getItem(WKEY)||'[]');const reviews=()=>JSON.parse(localStorage.getItem(RKEY)||'[]');function counts(){document.getElementById('cartCount').textContent=cart().reduce((s,x)=>s+(Number(x.quantity)||1),0);document.getElementById('wishlistCount').textContent=wish().length}function rating(id){const a=reviews().filter(r=>Number(r.product_id)===Number(id));if(!a.length)return '<span class="muted">No reviews yet</span>';const avg=a.reduce((s,r)=>s+Number(r.rating),0)/a.length;const n=Math.round(avg);return `<span>${'★'.repeat(n)}${'☆'.repeat(5-n)} ${avg.toFixed(1)} (${a.length} reviews)</span>`}function selectedSize(p){return document.querySelector('input[name="detail-size"]:checked')?.value||''}function add(p,go){const size=selectedSize(p);if(['Clothes','Shoes'].includes(p.category)&&!size)return alert('Please select a size');const c=cart(),key=p.id+'|'+size,old=c.find(x=>x.key===key);if(old){if(old.quantity>=p.stock)return alert('Stock limit reached');old.quantity++}else c.push({...p,quantity:1,size,key});localStorage.setItem(KEY,JSON.stringify(c));let v=JSON.parse(localStorage.getItem(VKEY)||'[]').filter(x=>Number(x.id)!==Number(p.id));v.unshift(p);localStorage.setItem(VKEY,JSON.stringify(v.slice(0,8)));counts();if(go)location.href='checkout.html?buynow=1';else alert('Added to cart')}function toggle(p){let w=wish(),i=w.findIndex(x=>Number(x.id)===Number(p.id));if(i>=0)w.splice(i,1);else w.push(p);localStorage.setItem(WKEY,JSON.stringify(w));counts();render(p)}function render(p){document.title=`${p.name} — TrendCart`;const sizeEntries=Object.entries(p.sizes||{}).filter(([s,q])=>Number(q)>0);const sizeHtml=sizeEntries.length?`<div><b>Choose Size</b><div class="detail-sizes">${sizeEntries.map(([s,q])=>`<label><input type="radio" name="detail-size" value="${esc(s)}"><span>${esc(s)} · ${q} left</span></label>`).join('')}</div></div>`:'';const isW=wish().some(x=>Number(x.id)===Number(p.id));document.getElementById('productRoot').innerHTML=`<div class="detail-wrap"><div class="detail-image">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:(p.category==='Shoes'?'👟':p.category==='Clothes'?'👕':'🛍️')}</div><div class="detail-info"><div class="detail-meta">${esc(p.category)} · ${Number(p.stock)>0?`In stock (${p.stock})`:'Out of stock'}</div><h1>${esc(p.name)}</h1><div class="rating-big">${rating(p.id)}</div><div class="detail-price">₹${Number(p.price).toFixed(0)}</div>${sizeHtml}<div class="detail-actions"><button type="button" ${Number(p.stock)<=0?'disabled':''} onclick='add(${JSON.stringify(p).replace(/'/g,'&#39;')},false)'>Add to Cart</button><button type="button" ${Number(p.stock)<=0?'disabled':''} onclick='add(${JSON.stringify(p).replace(/'/g,'&#39;')},true)'>Buy Now</button><button class="secondary" type="button" onclick='toggle(${JSON.stringify(p).replace(/'/g,'&#39;')})'>${isW?'♥ Remove Wishlist':'♡ Add to Wishlist'}</button><a class="btn secondary" href="reviews.html?product=${encodeURIComponent(p.id)}">⭐ Read / Write Reviews</a></div></div></div>`}function relatedCards(all,p){const r=all.filter(x=>Number(x.id)!==Number(p.id)&&String(x.category)===String(p.category)&&Number(x.stock)>0).slice(0,4);if(!r.length)return '<p class="muted">No related products available.</p>';return r.map(x=>`<a class="mini-card" href="product.html?id=${encodeURIComponent(x.id)}"><div>${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name)}" loading="lazy">`:'🛍️'}</div><h3>${esc(x.name)}</h3><div class="price">₹${Number(x.price).toFixed(0)}</div></a>`).join('')}async function load(){counts();const id=new URLSearchParams(location.search).get('id');if(!id){document.getElementById('productRoot').innerHTML='<div class="error"><h2>Product not found</h2><a href="index.html">Return to Shop</a></div>';return}try{const r=await fetch(API+'/api/products');if(!r.ok)throw Error();const all=await r.json(),p=all.find(x=>String(x.id)===String(id));if(!p)throw Error();let v=JSON.parse(localStorage.getItem(VKEY)||'[]').filter(x=>Number(x.id)!==Number(p.id));v.unshift(p);localStorage.setItem(VKEY,JSON.stringify(v.slice(0,8)));render(p);document.getElementById('related').innerHTML=relatedCards(all,p)}catch(e){document.getElementById('productRoot').innerHTML='<div class="error"><h2>Product load नहीं हो पाया</h2><p class="muted">Please refresh and try again.</p><a href="index.html">Return to Shop</a></div>';document.getElementById('related').innerHTML=''}}load();</script></body></html>
