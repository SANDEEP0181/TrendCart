<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>TrendCart Admin Dashboard</title><link rel="stylesheet" href="../style.css"><style>body{background:#f5f7fb}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:16px}.login{max-width:420px;margin:80px auto}input{width:100%;box-sizing:border-box;padding:10px;margin:5px 0;border:1px solid #d0d5dd;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700}button:disabled{opacity:.6;cursor:wait}.msg{padding:10px;border-radius:8px;margin:10px 0;display:none}.err{background:#fef3f2;color:#b42318}.ok{background:#ecfdf3;color:#067647}.muted{color:#667085}</style></head><body><header><b>TrendCart Admin</b><nav><a href="../index.html">Store</a><a href="support.html">Support</a></nav></header><main class="wrap"><section id="login" class="card login"><h2>🔐 Admin Login</h2><p class="muted">Secure TrendCart administration</p><input id="user" placeholder="Username" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" type="button">Login</button><div id="loginMsg" class="msg"></div></section><section id="app" class="card" style="display:none"><h1>📊 TrendCart Admin</h1><p class="ok" style="display:block">Login successful. Admin dashboard is loading...</p><button type="button" onclick="logout()">Logout</button></section></main><script>const API=location.origin,TK='trendcart_admin_token';let token=sessionStorage.getItem(TK);const $=id=>document.getElementById(id);function showMsg(text,ok=false){const e=$('loginMsg');e.textContent=text;e.className='msg '+(ok?'ok':'err');e.style.display='block'}async function login(){const btn=$('loginBtn'),username=$('user').value.trim(),password=$('pass').value;if(!username||!password){showMsg('Username and password are required.');return}btn.disabled=true;btn.textContent='Logging in...';showMsg('Connecting to TrendCart server...',true);try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({username,password}),signal:controller.signal,cache:'no-store'});clearTimeout(timer);const text=await r.text();let d={};try{d=JSON.parse(text)}catch(e){}if(!r.ok||!d.token)throw new Error(d.error||('Login failed (HTTP '+r.status+')'));sessionStorage.setItem(TK,d.token);token=d.token;showMsg('Login successful.',true);$('login').style.display='none';$('app').style.display='block';setTimeout(()=>location.href='/admin/dashboard.html',300)}catch(e){showMsg(e.name==='AbortError'?'Server response timed out. Please try again in a few seconds.':e.message||'Unable to connect to login server.');btn.disabled=false;btn.textContent='Login'}}function logout(){sessionStorage.removeItem(TK);location.reload()}$('loginBtn').addEventListener('click',login);$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(token){$('login').style.display='none';$('app').style.display='block'}</script></body></html>
