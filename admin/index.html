<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendCart Admin</title><link rel="stylesheet" href="../style.css"><style>body{background:#f5f7fb}.admin-wrap{max-width:1100px;margin:24px auto;padding:0 16px}.admin-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.admin-bar button{width:auto}.form{max-width:620px;margin:0 auto 28px;background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}.form input,.form select{width:100%;box-sizing:border-box;margin:7px 0;padding:11px;border:1px solid #ddd;border-radius:8px}.form button{margin-top:8px;width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:12px}.card button{width:auto;margin-right:6px}.section-title{margin-top:28px}.muted{color:#666}.error{background:#fff0f0;color:#b00020;padding:12px;border-radius:8px;margin-bottom:15px;display:none}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.order-products{margin:12px 0;padding:12px;background:#f8f9fc;border-radius:10px}.order-product{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #e5e7eb}.order-product:last-child{border-bottom:0}.order-total{font-size:18px;font-weight:700}.status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.status-row select{width:auto;margin:0;min-width:160px}.status-row button{margin:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:22px}.stat{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.06)}.stat .label{color:#666;font-size:13px}.stat .value{font-size:26px;font-weight:800;margin-top:5px}.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:700px){.analytics-grid{grid-template-columns:1fr}}.bar-row{display:grid;grid-template-columns:minmax(100px,1fr) 2fr 55px;gap:8px;align-items:center;margin:10px 0}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#111827;border-radius:99px}</style></head><body><header><b>TrendCart Admin</b><nav><a href="../index.html">Store</a></nav></header><main class="admin-wrap"><div class="error" id="error"></div><div class="form" id="login"><h2>Admin Login</h2><p class="muted">Secure TrendCart management panel</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button type="button" onclick="login()">Login</button></div><section id="panel" style="display:none"><div class="admin-bar"><h2>📊 Dashboard</h2><button type="button" onclick="logout()">Logout</button></div><div id="stats" class="stats"></div><div class="analytics-grid"><div class="card"><h3>🏆 Top Products</h3><div id="topProducts"></div></div><div class="card"><h3>📦 Order Status</h3><div id="statusStats"></div></div></div><div class="form"><h2 id="formTitle">Add Product</h2><input id="id" type="hidden"><input id="name" placeholder="Product name"><select id="category"><option>Clothes</option><option>Shoes</option><option>Other</option></select><input id="price" type="number" min="0" placeholder="Price"><input id="stock" type="number" min="0" placeholder="Total stock"><input id="image" placeholder="Image URL (optional)"><input id="sizes" placeholder='Sizes JSON e.g. {"S":5,"M":5}'><button type="button" onclick="saveProduct()">Save Product</button><button type="button" onclick="resetForm()">Clear</button></div><h2 class="section-title">Products</h2><div id="products" class="grid"></div><h2 class="section-title">⭐ Customer Reviews</h2><div id="reviews" class="grid"></div><h2 class="section-title">Orders</h2><div id="orders"></div></section></main><script>const API='https://trendcart-wozq.onrender.com';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('trendcart_admin_token');function showError(m){$('error').textContent=m;$('error').style.display='block'}function clearError(){$('error').style.display='none'}async function login(){clearError();try{const username=$('u').value.trim(),password=$('p').value;if(!username||!password)return showError('Username and password required.');const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;sessionStorage.setItem('trendcart_admin_token',token);show()}catch(e){showError(e.message)}}function logout(){token=null;sessionStorage.removeItem('trendcart_admin_token');$('panel').style.display='none';$('login').style.display='block'}function show(){$('login').style.display='none';$('panel').style.display='block';load()}async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(API+path,options);if(r.status===401){logout();throw Error('Session expired. Please login again.')}if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'API request failed')}return r.json()}function orderItemsHtml(items){if(!Array.isArray(items)||!items.length)return '<p class="muted">No product details available.</p>';return items.map(i=>`<div class="order-product"><span><b>${i.name||'Product'}</b>${i.size?' · Size '+i.size:''} × ${Number(i.quantity||0)}</span><span>₹${(Number(i.price||0)*Number(i.quantity||0)).toFixed(2)}</span></div>`).join('')}function reviewHtml(r){const stars='★'.repeat(Number(r.rating))+'☆'.repeat(5-Number(r.rating));return `<article class="card"><h3>${r.product_name||'Product'}</h3><div>${stars}</div><p><b>${r.customer_name||''}</b></p><p>${r.comment||''}</p><small class="muted">${r.created_at||''}</small></article>`}function renderAnalytics(ps,os){const active=os.filter(o=>String(o.status||'')!=='Cancelled');const revenue=active.reduce((s,o)=>s+Number(o.total||0),0);const pending=os.filter(o=>['Pending','Confirmed','Processing'].includes(o.status)).length;const delivered=os.filter(o=>o.status==='Delivered').length;const avg=active.length?revenue/active.length:0;const low=ps.filter(p=>Number(p.stock)>0&&Number(p.stock)<=5).length;const out=ps.filter(p=>Number(p.stock)<=0).length;$('stats').innerHTML=`<div class="stat"><div class="label">💰 Total Sales</div><div class="value">₹${revenue.toFixed(2)}</div></div><div class="stat"><div class="label">🛒 Total Orders</div><div class="value">${os.length}</div></div><div class="stat"><div class="label">⏳ Active Orders</div><div class="value">${pending}</div></div><div class="stat"><div class="label">🚚 Delivered</div><div class="value">${delivered}</div></div><div class="stat"><div class="label">📈 Avg Order Value</div><div class="value">₹${avg.toFixed(2)}</div></div><div class="stat"><div class="label">⚠️ Inventory Alerts</div><div class="value">${low+out}</div><small class="muted">${low} low · ${out} out</small></div>`;const productMap={};active.forEach(o=>(Array.isArray(o.items)?o.items:[]).forEach(i=>{const n=i.name||'Product';productMap[n]=(productMap[n]||0)+Number(i.quantity||0)}));const top=Object.entries(productMap).sort((a,b)=>b[1]-a[1]).slice(0,5),max=top[0]?.[1]||1;$('topProducts').innerHTML=top.length?top.map(([n,q])=>`<div class="bar-row"><span>${n}</span><div class="bar"><span style="width:${(q/max*100).toFixed(0)}%"></span></div><b>${q}</b></div>`).join(''):'<p class="muted">No sales yet.</p>';const sc={Pending:0,Confirmed:0,Processing:0,Shipped:0,'Out for Delivery':0,Delivered:0,Cancelled:0};os.forEach(o=>{if(sc[o.status]!==undefined)sc[o.status]++});const sm=Math.max(...Object.values(sc),1);$('statusStats').innerHTML=Object.entries(sc).map(([n,q])=>`<div class="bar-row"><span>${n}</span><div class="bar"><span style="width:${(q/sm*100).toFixed(0)}%"></span></div><b>${q}</b></div>`).join('')}async function load(){clearError();try{const ps=await fetch(API+'/api/products').then(r=>r.json());const os=await api('/api/orders');renderAnalytics(ps,os);$('products').innerHTML=ps.length?ps.map(x=>`<article class="card"><h3>${x.name}</h3><p>${x.category} · ₹${x.price} · Stock ${x.stock}</p><p>${JSON.stringify(x.sizes||{})}</p><button onclick='edit(${JSON.stringify(x)})'>Edit</button><button onclick='del(${x.id})'>Delete</button></article>`).join(''):'<p class="muted">No products yet.</p>';try{const rv=await api('/api/reviews');$('reviews').innerHTML=rv.length?rv.map(reviewHtml).join(''):'<p class="muted">No reviews yet.</p>'}catch(e){$('reviews').innerHTML='<p class="muted">Reviews API not available.</p>'}$('orders').innerHTML=os.length?os.map(o=>`<div class="card"><div class="order-head"><h3 style="margin:0">Order #${o.id}</h3><span class="order-total">₹${Number(o.total||0).toFixed(2)}</span></div><p><b>Order Date & Time:</b> ${o.created_at_ist||'N/A'}</p><p><b>Customer:</b> ${o.customer_name||'N/A'}</p><p><b>Mobile:</b> ${o.mobile||'N/A'}</p><p><b>Address:</b> ${o.address||''}, ${o.city||''}, ${o.state||''} ${o.pincode||''}</p><div class="order-products"><b>Ordered Products</b>${orderItemsHtml(o.items)}</div><p><b>Payment:</b> ${o.payment_method||'N/A'} · <b>Total:</b> ₹${Number(o.total||0).toFixed(2)}</p><p class="status-row"><b>Status:</b><select id="status-${o.id}">${['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'].map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s}</option>`).join('')}</select><button onclick="status(${o.id},document.getElementById('status-${o.id}').value)">Save</button></p></div>`).join(''):'<p class="muted">No orders yet.</p>'}catch(e){showError(e.message)}}function edit(x){$('id').value=x.id;$('name').value=x.name;$('category').value=x.category;$('price').value=x.price;$('stock').value=x.stock;$('image').value=x.image||'';$('sizes').value=JSON.stringify(x.sizes||{});$('formTitle').textContent='Edit Product';scrollTo({top:0,behavior:'smooth'})}function resetForm(){['id','name','price','stock','image','sizes'].forEach(i=>$(i).value='');$('category').value='Clothes';$('formTitle').textContent='Add Product'}async function saveProduct(){let sz={};try{sz=$('sizes').value?JSON.parse($('sizes').value):{}}catch(e){return showError('Invalid sizes JSON')}const body={name:$('name').value.trim(),category:$('category').value,price:Number($('price').value),stock:Number($('stock').value),image:$('image').value.trim()||null,sizes:sz};if(!body.name||body.price<0||body.stock<0)return showError('Product name, price aur stock check karein.');const editing=!!$('id').value;try{await api('/api/products'+(editing?'/'+$('id').value:''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});resetForm();await load()}catch(e){showError(e.message)}}async function del(i){if(!confirm('Delete product?'))return;try{await api('/api/products/'+i,{method:'DELETE'});await load()}catch(e){showError(e.message)}}async function status(i,s){try{await api('/api/orders/'+i+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});await load()}catch(e){showError(e.message)}}if(token)show();</script></body></html>
