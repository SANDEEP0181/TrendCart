<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrendCart Admin</title><link rel="stylesheet" href="../style.css">
<style>body{background:#f5f7fb}header{position:sticky;top:0;z-index:5}.admin-wrap{max-width:1100px;margin:24px auto;padding:0 16px}.admin-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.admin-bar button{width:auto}.form{max-width:620px;margin:0 auto 28px;background:#fff;padding:20px;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.07)}.form input,.form select{width:100%;box-sizing:border-box;margin:7px 0;padding:11px;border:1px solid #ddd;border-radius:8px}.form button{margin-top:8px;width:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:12px}.card button{width:auto;margin-right:6px}.section-title{margin-top:28px}.muted{color:#666}.error{background:#fff0f0;color:#b00020;padding:12px;border-radius:8px;margin-bottom:15px;display:none}</style>
</head>
<body><header><b>TrendCart Admin</b><nav><a href="../index.html">Store</a></nav></header>
<main class="admin-wrap"><div class="error" id="error"></div>
<div class="form" id="login"><h2>Admin Login</h2><p class="muted">Secure TrendCart management panel</p><input id="u" placeholder="Username" autocomplete="username"><input id="p" type="password" placeholder="Password" autocomplete="current-password"><button onclick="login()">Login</button></div>
<section id="panel" style="display:none"><div class="admin-bar"><h2>Dashboard</h2><button onclick="logout()">Logout</button></div>
<div class="form"><h2 id="formTitle">Add Product</h2><input id="id" type="hidden"><input id="name" placeholder="Product name"><select id="category"><option>Clothes</option><option>Shoes</option><option>Other</option></select><input id="price" type="number" min="0" placeholder="Price"><input id="stock" type="number" min="0" placeholder="Total stock"><input id="image" placeholder="Image URL (optional)"><input id="sizes" placeholder='Sizes JSON e.g. {"S":5,"M":5}'><button onclick="saveProduct()">Save Product</button><button onclick="resetForm()">Clear</button></div>
<h2 class="section-title">Products</h2><div id="products" class="grid"></div><h2 class="section-title">Orders</h2><div id="orders"></div></section></main>
<script>
const API='https://trendcart-wozq.onrender.com';const $=id=>document.getElementById(id);let token=sessionStorage.getItem('trendcart_admin_token');
function showError(m){$('error').textContent=m;$('error').style.display='block'}function clearError(){$('error').style.display='none'}
async function login(){clearError();try{const r=await fetch(API+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;sessionStorage.setItem('trendcart_admin_token',token);show()}catch(e){showError(e.message)}}
function logout(){token=null;sessionStorage.removeItem('trendcart_admin_token');$('panel').style.display='none';$('login').style.display='block'}
function show(){$('login').style.display='none';$('panel').style.display='block';load()}
function resetForm(){$('id').value='';$('name').value='';$('category').value='Clothes';$('price').value='';$('stock').value='';$('image').value='';$('sizes').value='';$('formTitle').textContent='Add Product'}
async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(API+path,options);if(r.status===401){logout();throw Error('Session expired. Please login again.')}if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'API request failed')}return r.json()}
async function load(){clearError();try{const ps=await fetch(API+'/api/products').then(r=>r.json());$('products').innerHTML=ps.length?ps.map(x=>`<article class="card"><h3>${x.name}</h3><p>${x.category} · ₹${x.price} · Stock ${x.stock}</p><p>${JSON.stringify(x.sizes||{})}</p><button onclick='edit(${JSON.stringify(x)})'>Edit</button><button onclick='del(${x.id})'>Delete</button></article>`).join(''):'<p class="muted">No products yet.</p>';const os=await api('/api/orders');$('orders').innerHTML=os.length?os.map(o=>`<div class="card"><b>Order #${o.id}</b> — ${o.customer_name} — ₹${o.total}<p>${o.mobile}, ${o.address}, ${o.city}, ${o.state} ${o.pincode}</p><p>Status: <select onchange="status(${o.id},this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></p><p class="muted">Payment: ${o.payment_method||'N/A'}</p></div>`).join(''):'<p class="muted">No orders yet.</p>'}catch(e){showError(e.message)}}
function edit(x){$('id').value=x.id;$('name').value=x.name;$('category').value=x.category;$('price').value=x.price;$('stock').value=x.stock;$('image').value=x.image||'';$('sizes').value=JSON.stringify(x.sizes||{});$('formTitle').textContent='Edit Product';scrollTo({top:0,behavior:'smooth'})}
async function saveProduct(){let sz={};try{sz=$('sizes').value?JSON.parse($('sizes').value):{}}catch(e){return showError('Invalid sizes JSON')}const body={name:$('name').value.trim(),category:$('category').value,price:Number($('price').value),stock:Number($('stock').value),image:$('image').value.trim()||null,sizes:sz};if(!body.name||body.price<0||body.stock<0)return showError('Product name, price aur stock check karein.');const editing=!!$('id').value;try{await api('/api/products'+(editing?'/'+$('id').value:''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});resetForm();await load()}catch(e){showError(e.message)}}
async function del(i){if(!confirm('Delete product?'))return;try{await api('/api/products/'+i,{method:'DELETE'});await load()}catch(e){showError(e.message)}}
async function status(i,s){try{await api('/api/orders/'+i+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});await load()}catch(e){showError(e.message)}}
if(token)show();
</script></body></html>
