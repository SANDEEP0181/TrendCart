<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendCart Admin</title><link rel="stylesheet" href="../style.css"></head><body><header><b>TrendCart Admin</b><nav><a href="../index.html">Store</a></nav></header><main><div class="form" id="login"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button></div><section id="panel" style="display:none"><div class="form"><h2 id="formTitle">Add Product</h2><input id="id" type="hidden"><input id="name" placeholder="Product name"><select id="category"><option>Clothes</option><option>Shoes</option><option>Other</option></select><input id="price" type="number" placeholder="Price"><input id="stock" type="number" placeholder="Total stock"><input id="image" placeholder="Image URL (optional)"><input id="sizes" placeholder="Sizes JSON e.g. {&quot;S&quot;:5,&quot;M&quot;:5}"><button onclick="saveProduct()">Save Product</button> <button onclick="resetForm()">Clear</button></div><h2>Products</h2><div id="products" class="grid"></div><h2>Orders</h2><div id="orders"></div></section></main><script>const API='http://localhost:5000';function login(){if(u.value==='admin'&&p.value==='admin123'){sessionStorage.admin='1';show()}else alert('Invalid login')}function show(){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load()}function resetForm(){id.value='';name.value='';price.value='';stock.value='';image.value='';sizes.value='';formTitle.textContent='Add Product'}async function load(){const ps=await(await fetch(API+'/api/products')).json();products.innerHTML=ps.map(x=>`<article class="card"><h3>${x.name}</h3><p>${x.category} · ₹${x.price} · Stock ${x.stock}</p><p>${JSON.stringify(x.sizes||{})}</p><button onclick='edit(${JSON.stringify(x)})'>Edit</button> <button onclick='del(${x.id})'>Delete</button></article>`).join('');const os=await(await fetch(API+'/api/orders')).json();orders.innerHTML=os.length?os.map(o=>`<div class="card"><b>Order #${o.id}</b> — ${o.customer_name} — ₹${o.total}<p>${o.mobile}, ${o.city}, ${o.state} ${o.pincode}</p><select onchange="status(${o.id},this.value)">${['Pending','Confirmed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<p>No orders yet.</p>'}function edit(x){id.value=x.id;name.value=x.name;category.value=x.category;price.value=x.price;stock.value=x.stock;image.value=x.image||'';sizes.value=JSON.stringify(x.sizes||{});formTitle.textContent='Edit Product'}async function saveProduct(){let sz={};try{sz=sizes.value?JSON.parse(sizes.value):{}}catch(e){return alert('Invalid sizes JSON')}const body={name:name.value,category:category.value,price:Number(price.value),stock:Number(stock.value),image:image.value||null,sizes:sz};const editing=!!id.value;const r=await fetch(API+'/api/products'+(editing?'/'+id.value:''),{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert('Save failed');resetForm();load()}async function del(i){if(!confirm('Delete product?'))return;await fetch(API+'/api/products/'+i,{method:'DELETE'});load()}async function status(i,s){await fetch(API+'/api/orders/'+i+'/status',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s})});load()}if(sessionStorage.admin==='1')show();</script></body></html>
