<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>TrendCart Inventory</title><link rel="stylesheet" href="../style.css"><style>body{background:#f5f7fb}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:26px;font-weight:800}.muted{color:#667085}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar button,a.btn{width:auto;padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700;text-decoration:none;background:#eef4ff;color:#175cd3}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left}.scroll{overflow:auto}.low{font-weight:800}.zero{font-weight:800}.ok{color:#067647}.warn{color:#b54708}.bad{color:#b42318}.tools{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin:14px 0}input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}@media(max-width:600px){.tools{grid-template-columns:1fr}}</style></head><body><header><b>TrendCart Admin</b><nav><a href="index.html">Dashboard</a><a href="analytics.html">Analytics</a><a href="../index.html">Store</a></nav></header><main class="wrap"><div class="toolbar"><h1>📦 Inventory</h1><div><a class="btn" href="index.html">← Dashboard</a> <button onclick="load()">↻ Refresh</button></div></div><div class="grid"><div class="card"><div class="muted">Total Products</div><div id="total" class="stat">—</div></div><div class="card"><div class="muted">Total Units</div><div id="units" class="stat">—</div></div><div class="card"><div class="muted">Low Stock ≤ 5</div><div id="low" class="stat warn">—</div></div><div class="card"><div class="muted">Out of Stock</div><div id="zero" class="stat bad">—</div></div></div><section class="card"><div class="tools"><input id="q" placeholder="Search product or category" oninput="render()"><select id="filter" onchange="render()"><option value="all">All stock</option><option value="low">Low stock (≤5)</option><option value="zero">Out of stock</option><option value="ok">Healthy stock (>5)</option></select></div><div id="count" class="muted"></div><div class="scroll"><table class="table"><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Sizes</th><th>Health</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>const API='https://trendcart-wozq.onrender.com';let products=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])}async function load(){try{const r=await fetch(API+'/api/products');if(!r.ok)throw Error('Unable to load inventory');products=await r.json();update();render()}catch(e){$('body').innerHTML='<tr><td colspan="7">'+esc(e.message)+'</td></tr>'}}function update(){$('total').textContent=products.length;$('units').textContent=products.reduce((s,p)=>s+Number(p.stock||0),0);$('low').textContent=products.filter(p=>Number(p.stock||0)>0&&Number(p.stock||0)<=5).length;$('zero').textContent=products.filter(p=>Number(p.stock||0)<=0).length}function render(){const q=($('q').value||'').toLowerCase().trim(),f=$('filter').value;const list=products.filter(p=>{const stock=Number(p.stock||0),hay=(String(p.name)+' '+String(p.category)).toLowerCase();return(!q||hay.includes(q))&&(f==='all'||(f==='low'&&stock>0&&stock<=5)||(f==='zero'&&stock<=0)||(f==='ok'&&stock>5))});$('count').textContent='Showing '+list.length+' of '+products.length+' products';$('body').innerHTML=list.length?list.map(p=>{const stock=Number(p.stock||0);const health=stock<=0?'<span class="bad">OUT OF STOCK</span>':stock<=5?'<span class="warn">LOW STOCK</span>':'<span class="ok">HEALTHY</span>';return `<tr><td>${p.id}</td><td><b>${esc(p.name)}</b></td><td>${esc(p.category)}</td><td>₹${Number(p.price||0).toFixed(2)}</td><td class="${stock<=0?'zero':stock<=5?'low':''}">${stock}</td><td><code>${esc(JSON.stringify(p.sizes||{}))}</code></td><td>${health}</td></tr>`}).join(''):'<tr><td colspan="7">No matching products.</td></tr>'}load();</script></body></html>
