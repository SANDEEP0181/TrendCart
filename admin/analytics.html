<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>TrendCart Sales Analytics</title><link rel="stylesheet" href="../style.css"><style>body{background:#f5f7fb}.wrap{max-width:1200px;margin:24px auto;padding:0 16px}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.muted{color:#667085}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.toolbar button{width:auto}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.msg{padding:10px;border-radius:8px;background:#fef3f2;color:#b42318;display:none}.bar{height:22px;background:#eee;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#475467}.row{margin:12px 0}.rowtop{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.scroll{overflow:auto}@media(max-width:700px){.table{font-size:13px}}</style></head><body><header><b>TrendCart Admin</b><nav><a href="index.html">Dashboard</a><a href="../index.html">Store</a></nav></header><main class="wrap"><div class="toolbar"><h1>📈 Sales Analytics</h1><button onclick="load()">↻ Refresh</button></div><div id="msg" class="msg"></div><div class="grid"><div class="card"><div class="muted">Total Orders</div><div id="orders" class="stat">—</div></div><div class="card"><div class="muted">Net Sales</div><div id="sales" class="stat">—</div></div><div class="card"><div class="muted">Average Order Value</div><div id="aov" class="stat">—</div></div><div class="card"><div class="muted">Delivered</div><div id="delivered" class="stat">—</div></div><div class="card"><div class="muted">Cancelled</div><div id="cancelled" class="stat">—</div></div><div class="card"><div class="muted">Pending / Active</div><div id="active" class="stat">—</div></div></div><section class="card"><h2>Order Status</h2><div id="status"></div></section><section class="card"><h2>Top Products by Units Sold</h2><div id="products"></div></section><section class="card"><h2>Recent Orders</h2><div class="scroll"><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody id="recent"></tbody></table></div></section></main><script>const API='https://trendcart-wozq.onrender.com',TK='trendcart_admin_token';let token=sessionStorage.getItem(TK);const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){if(!token){location.href='index.html';return}try{const r=await fetch(API+'/api/orders',{headers:{Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem(TK);location.href='index.html';return}if(!r.ok)throw Error(d.error||'Unable to load analytics');const orders=Array.isArray(d)?d:[];const valid=orders.filter(o=>String(o.status)!=='Cancelled');const sales=valid.reduce((s,o)=>s+Number(o.total||0),0);$('orders').textContent=orders.length;$('sales').textContent='₹'+sales.toFixed(2);$('aov').textContent='₹'+(valid.length?sales/valid.length:0).toFixed(2);$('delivered').textContent=orders.filter(o=>o.status==='Delivered').length;$('cancelled').textContent=orders.filter(o=>o.status==='Cancelled').length;$('active').textContent=orders.filter(o=>['Pending','Confirmed','Processing','Shipped','Out for Delivery'].includes(String(o.status))).length;const statuses=['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered','Cancelled'];const counts=Object.fromEntries(statuses.map(s=>[s,orders.filter(o=>o.status===s).length]));const max=Math.max(1,...Object.values(counts));$('status').innerHTML=statuses.map(s=>`<div class="row"><div class="rowtop"><b>${esc(s)}</b><span>${counts[s]}</span></div><div class="bar"><span style="width:${counts[s]/max*100}%"></span></div></div>`).join('');const units={};orders.forEach(o=>{if(String(o.status)==='Cancelled')return;let items=[];try{items=typeof o.items==='string'?JSON.parse(o.items):o.items||[]}catch(e){}items.forEach(i=>{const name=String(i.name||'Unknown');units[name]=(units[name]||0)+Number(i.quantity||0)})});const top=Object.entries(units).sort((a,b)=>b[1]-a[1]).slice(0,8);const topMax=Math.max(1,...top.map(x=>x[1]));$('products').innerHTML=top.length?top.map(([n,q])=>`<div class="row"><div class="rowtop"><b>${esc(n)}</b><span>${q} units</span></div><div class="bar"><span style="width:${q/topMax*100}%"></span></div></div>`).join(''):'<p class="muted">No sales data yet.</p>';$('recent').innerHTML=orders.slice(0,15).map(o=>`<tr><td>#${esc(o.id)}</td><td>${esc(o.created_at_ist||'')}</td><td>₹${Number(o.total||0).toFixed(2)}</td><td>${esc(o.status)}</td></tr>`).join('')||'<tr><td colspan="4">No orders yet.</td></tr>'}catch(e){$('msg').textContent=e.message;$('msg').style.display='block'}}load();</script></body></html>
