<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendCart Support Tickets</title><link rel="stylesheet" href="../style.css"><style>body{background:#f5f7fb}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.filters button{width:auto}.card{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.06);margin-bottom:14px}.card textarea,.card select{width:100%;box-sizing:border-box;margin:7px 0;padding:10px;border:1px solid #ddd;border-radius:8px}.status{display:inline-block;padding:5px 10px;border-radius:99px;background:#eef2ff}.error{display:none;background:#fff0f0;color:#b00020;padding:12px;border-radius:8px;margin:12px 0}</style></head><body><header><b>TrendCart Admin</b><nav><a href="index.html">Dashboard</a><a href="../support.html">Customer Support</a><a href="../index.html">Store</a></nav></header><main class="wrap"><div class="top"><h1>🎧 Support Tickets</h1><button onclick="logout()">Logout</button></div><div id="error" class="error"></div><div class="filters"><button onclick="load('')">All</button><button onclick="load('Open')">Open</button><button onclick="load('In Progress')">In Progress</button><button onclick="load('Resolved')">Resolved</button></div><div id="tickets"></div></main><script>const API='https://trendcart-wozq.onrender.com';let token=sessionStorage.getItem('trendcart_admin_token');if(!token){location.href='index.html'}function showError(m){const e=document.getElementById('error');e.textContent=m;e.style.display='block'}function logout(){sessionStorage.removeItem('trendcart_admin_token');location.href='index.html'}async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(API+path,options);if(r.status===401){logout();throw Error('Session expired')}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}async function load(status=''){try{document.getElementById('tickets').innerHTML='<p>Loading...</p>';const d=await api('/api/admin/support/tickets'+(status?'?status='+encodeURIComponent(status):''));const list=d.tickets||[];document.getElementById('tickets').innerHTML=list.length?list.map(t=>`<article class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><h2 style="margin:0">${esc(t.ticket_code)}</h2><span class="status">${esc(t.status)}</span></div><p><b>${esc(t.subject)}</b></p><p><b>Customer:</b> ${esc(t.name)} · ${esc(t.email)}${t.mobile?' · '+esc(t.mobile):''}</p>${t.order_id?`<p><b>Order ID:</b> ${esc(t.order_id)}</p>`:''}<p>${esc(t.message)}</p><hr><label>Status</label><select id="status-${t.id}"><option ${t.status==='Open'?'selected':''}>Open</option><option ${t.status==='In Progress'?'selected':''}>In Progress</option><option ${t.status==='Resolved'?'selected':''}>Resolved</option></select><label>Reply</label><textarea id="reply-${t.id}" rows="4" maxlength="3000" placeholder="Reply to customer...">${esc(t.admin_reply||'')}</textarea><button onclick="save(${t.id})">Save Ticket</button><small class="muted">Created: ${new Date(t.created_at).toLocaleString('en-IN')} · Updated: ${new Date(t.updated_at).toLocaleString('en-IN')}</small></article>`).join(''):'<p class="muted">No support tickets found.</p>'}catch(e){showError(e.message)}}async function save(id){try{await api('/api/admin/support/tickets/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:document.getElementById('status-'+id).value,admin_reply:document.getElementById('reply-'+id).value})});await load()}catch(e){showError(e.message)}}load();</script></body></html>
