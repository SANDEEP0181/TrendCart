<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Your saved TrendCart products.">
<title>TrendCart — Wishlist</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="logo" href="index.html">TrendCart</a>
  <nav>
    <a href="index.html#products">Shop</a>
    <a href="track-order.html">Track Order</a>
    <a href="wishlist.html">♡ Wishlist <span id="wishlistCount">0</span></a>
    <a href="cart.html">🛒 Cart <span id="cartCount">0</span></a>
  </nav>
</header>
<main>
  <div class="section-head">
    <div><span class="eyebrow">SAVED FOR LATER</span><h2>My Wishlist</h2></div>
  </div>
  <div id="wishlistGrid" class="grid"><p class="loading">Loading wishlist...</p></div>
</main>
<footer><b>TrendCart</b><span>Simple shopping. Trending choices.</span></footer>
<script src="script.js"></script>
<script>
function renderWishlist(){
  const g=document.getElementById('wishlistGrid');
  if(!g)return;
  const items=wishlist();
  document.getElementById('wishlistCount').textContent=items.length;
  if(!items.length){g.innerHTML='<div class="empty-state"><div class="empty-icon">♡</div><h3>Your wishlist is empty</h3><p>Save products you love and find them here later.</p><a class="btn" href="index.html#products">Continue Shopping</a></div>';return}
  g.innerHTML=items.map(p=>{
    const sizes=p.sizes||{};
    const opts=Object.entries(sizes).filter(([s,q])=>q>0).map(([s,q])=>`<label><input type="radio" name="wish-size-${p.id}" value="${s}">${s}</label>`).join('');
    return `<article class="card"><div class="pic">${p.image?`<img src="${p.image}" alt="${escapeHtml(p.name)}" loading="lazy">`:(p.category==='Shoes'?'👟':p.category==='Clothes'?'👕':'🛍️')}</div><h3>${escapeHtml(p.name)}</h3><div class="muted">${escapeHtml(p.category)} · Stock ${p.stock}</div><div class="price">₹${Number(p.price).toFixed(0)}</div>${opts?`<div class="sizes">${opts}</div>`:''}<button type="button" onclick='add(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Add to Cart</button><button class="secondary-btn" type="button" onclick="removeWishlist(${p.id})">Remove from Wishlist</button></article>`
  }).join('');
}
renderWishlist();
</script>
</body>
</html>
