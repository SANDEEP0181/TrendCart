<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account - TrendCart</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">TrendCart</a><nav><a href="index.html">Shop</a><a href="track-order.html">Track Order</a><a href="wishlist.html">Wishlist</a><a href="cart.html">Cart</a></nav></header><main><div class="form" style="max-width:760px;margin:30px auto"><h2>👤 My Account</h2><div id="message" class="muted" style="min-height:24px;margin:8px 0"></div><section id="authBox"><div style="display:grid;gap:10px"><input id="name" placeholder="Full Name"><input id="email" type="email" placeholder="Email Address" autocomplete="email"><input id="mobile" placeholder="Mobile Number" inputmode="numeric"><input id="password" type="password" placeholder="Password (minimum 8 characters)" autocomplete="new-password"><button id="action">Create Account</button><button id="toggle" type="button">Already have an account? Login</button></div></section><section id="accountBox" style="display:none"><div id="profile" style="padding:16px;border:1px solid #ddd;border-radius:12px"></div><h3 style="margin-top:28px">📋 My Orders</h3><div id="orders"><p class="muted">Loading orders...</p></div><div style="display:flex;gap:10px;margin-top:18px;flex-wrap:wrap"><a class="button" href="index.html">Continue Shopping</a><button id="logout" type="button">Logout</button></div></section></div></main><script>const API='https://trendcart-wozq.onrender.com',TK='trendcart_customer_token';let login=false;const $=id=>document.getElementById(id),msg=$('message');function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setMsg(t,ok=false){msg.textContent=t;msg.style.color=ok?'green':''}function save(d){localStorage.setItem(TK,d.token);showAccount(d.customer)}async function loadOrders(){const t=localStorage.getItem(TK);if(!t)return;try{const r=await fetch(API+'/api/customer/orders',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load orders');if(!d.orders?.length){$('orders').innerHTML='<p class="muted">No orders found yet.</p>';return}$('orders').innerHTML=d.orders.map(o=>{let items=[];try{items=typeof o.items==='string'?JSON.parse(o.items):o.items||[]}catch(e){}return '<div style="border:1px solid #ddd;border-radius:12px;padding:15px;margin:10px 0"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><b>Order #'+o.id+'</b><b>'+esc(o.status)+'</b></div><p class="muted">'+esc(o.created_at_ist||'')+'</p><p>'+items.map(i=>esc(i.name)+' × '+Number(i.quantity||0)+(i.size?' ('+esc(i.size)+')':'')).join('<br>')+'</p><p><b>Total: ₹'+Number(o.total||0).toFixed(2)+'</b> · '+esc(o.payment_method)+'</p><a class="button" href="track-order.html?id='+encodeURIComponent(o.id)+'&mobile='+encodeURIComponent(o.mobile)+'">Track Order</a> <a class="button" href="invoice.html?id='+encodeURIComponent(o.id)+'&mobile='+encodeURIComponent(o.mobile)+'">Invoice</a></div>'}).join('')}catch(e){$('orders').innerHTML='<p>'+esc(e.message)+'</p>'}}function showAccount(c){$('authBox').style.display='none';$('accountBox').style.display='block';$('profile').innerHTML='<h3>'+esc(c.name)+'</h3><p><b>Email:</b> '+esc(c.email)+'</p><p><b>Mobile:</b> '+esc(c.mobile)+'</p>';setMsg('You are logged in.',true);loadOrders()}async function check(){const t=localStorage.getItem(TK);if(!t)return;try{const r=await fetch(API+'/api/customer/me',{headers:{Authorization:'Bearer '+t}});const d=await r.json();if(r.ok)showAccount(d.customer);else localStorage.removeItem(TK)}catch(e){}}$('toggle').onclick=()=>{login=!login;$('name').style.display=login?'none':'';$('mobile').style.display=login?'none':'';$('password').value='';$('action').textContent=login?'Login':'Create Account';$('toggle').textContent=login?'New customer? Create account':'Already have an account? Login';setMsg('')};$('action').onclick=async()=>{const body=login?{email:$('email').value.trim(),password:$('password').value}:{name:$('name').value.trim(),email:$('email').value.trim(),mobile:$('mobile').value.trim(),password:$('password').value};$('action').disabled=true;setMsg(login?'Signing in...':'Creating account...');try{const r=await fetch(API+(login?'/api/customer/login':'/api/customer/register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');save(d)}catch(e){setMsg(e.message)}finally{$('action').disabled=false}};$('logout').onclick=()=>{localStorage.removeItem(TK);location.reload()};check();</script></body></html>
