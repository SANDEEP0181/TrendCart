<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendCart Checkout</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f6f6f6;color:#222}.wrap{max-width:900px;margin:30px auto;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 12px #0001;margin-bottom:16px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px}button{padding:13px 18px;border:0;border-radius:8px;cursor:pointer;font-weight:700}.place{width:100%;background:#111;color:#fff;font-size:16px}.msg{display:none;padding:12px;border-radius:8px;margin:10px 0}.err{background:#fee;color:#a00}.ok{background:#efe;color:#075}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Checkout</h1><div class="card"><h3>Delivery Details</h3><input id="name" placeholder="Full Name" required><input id="mobile" placeholder="Mobile Number" inputmode="numeric" required><textarea id="address" placeholder="Full Address" required></textarea><div class="row"><input id="city" placeholder="City" required><input id="state" placeholder="State" required></div><input id="pincode" placeholder="Pincode" inputmode="numeric" maxlength="6" required><div id="pinMsg" class="msg"></div></div><div class="card"><h3>Payment</h3><label><input type="radio" name="payment" value="COD" checked> Cash on Delivery</label><br><label><input type="radio" name="payment" value="ONLINE"> Online Payment</label></div><div class="card"><h3>Order Summary</h3><div id="summary">Loading cart...</div><div id="msg" class="msg"></div><button id="placeOrder" class="place" type="button">Place Order</button></div></div><script>const API='https://trendcart-wozq.onrender.com';const $=id=>document.getElementById(id);function cart(){try{return JSON.parse(localStorage.getItem('cart')||'[]')}catch(e){return[]}}function show(text,ok=false){const m=$('msg');m.textContent=text;m.className='msg '+(ok?'ok':'err');m.style.display='block'}function render(){const c=cart();if(!c.length){$('summary').textContent='Your cart is empty.';return}let subtotal=0;c.forEach(x=>subtotal+=Number(x.price||0)*Number(x.quantity||1));$('summary').innerHTML=c.map(x=>`${x.name||'Product'} × ${x.quantity||1} ${x.size?'(Size '+x.size+')':''}`).join('<br>')+`<hr>Subtotal: ₹${subtotal.toFixed(2)}<br>Shipping: ${subtotal>=999?'Free':'₹49'}<br><b>Total: ₹${(subtotal+(subtotal>=999?0:49)).toFixed(2)}</b>`}async function checkPin(){const p=$('pincode').value.trim();if(!/^\d{6}$/.test(p)){return false}try{const r=await fetch('https://api.postalpincode.in/pincode/'+p);const d=await r.json();if(d&&d[0]&&d[0].Status==='Success'){$('pinMsg').textContent='Pincode available';$('pinMsg').className='msg ok';$('pinMsg').style.display='block';return true}throw Error('Pincode not available')}catch(e){$('pinMsg').textContent='Pincode check failed. Please try again.';$('pinMsg').className='msg err';$('pinMsg').style.display='block';return false}}$('pincode').addEventListener('blur',checkPin);$('placeOrder').addEventListener('click',async()=>{const b=$('placeOrder');b.disabled=true;b.textContent='Placing Order...';$('msg').style.display='none';try{const body={customer_name:$('name').value.trim(),mobile:$('mobile').value.trim(),address:$('address').value.trim(),city:$('city').value.trim(),state:$('state').value.trim(),pincode:$('pincode').value.trim(),payment_method:document.querySelector('input[name="payment"]:checked').value==='COD'?'COD':'ONLINE',items:cart()};if(Object.values(body).some(v=>v===''||v==null)||!body.items.length)throw Error('Please fill all delivery details and make sure cart is not empty');if(!/^\d{10}$/.test(body.mobile))throw Error('Please enter a valid 10-digit mobile number');if(!/^\d{6}$/.test(body.pincode))throw Error('Please enter a valid 6-digit pincode');if(!(await checkPin()))throw Error('Please enter a valid serviceable pincode');if(body.payment_method==='ONLINE')throw Error('Online payment is temporarily unavailable. Please select Cash on Delivery.');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:controller.signal});clearTimeout(timer);let data={};try{data=await r.json()}catch(e){throw Error('Server returned an invalid response')}if(!r.ok||!data.success)throw Error(data.error||'Order could not be placed');localStorage.setItem('trendcart_last_order',JSON.stringify(data));localStorage.removeItem('cart');location.href='./order-confirmation.html?order_id='+encodeURIComponent(data.orderId)}catch(e){show(e.name==='AbortError'?'Server response timed out. Please try again.':(e.message||'Order failed'));b.disabled=false;b.textContent='Place Order'}});render();</script></body></html>
