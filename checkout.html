<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - TrendCart</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">TrendCart</a></header><main><div class="form"><h2>Checkout</h2><div id="summary"></div><form id="f"><input id="name" placeholder="Full Name" required><input id="mobile" placeholder="Mobile Number" required><textarea id="address" placeholder="Full Address" required></textarea><input id="city" placeholder="City" required><input id="state" placeholder="State" required><input id="pin" placeholder="Pincode" required><select id="pay"><option value="COD">Cash on Delivery</option></select><button type="submit">Place Order</button></form></div></main><script>const API='http://localhost:5000',K='trendcart_cart',c=JSON.parse(localStorage.getItem(K)||'[]');let total=c.reduce((s,x)=>s+x.price*x.quantity,0);document.getElementById('summary').innerHTML=`<p>${c.length} cart item(s)</p><div class="total">Total: ₹${total}</div>`;document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!c.length)return alert('Cart is empty');const body={customer_name:name.value,mobile:mobile.value,address:address.value,city:city.value,state:state.value,pincode:pin.value,payment_method:pay.value,items:c,total};try{const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);localStorage.removeItem(K);alert('Order placed successfully! Order ID: #'+d.orderId);location.href='index.html'}catch(err){alert('Order failed: '+err.message)}};</script></body></html>
