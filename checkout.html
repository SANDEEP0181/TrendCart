<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - TrendCart</title><link rel="stylesheet" href="style.css"><script src="https://checkout.razorpay.com/v1/checkout.js"></script></head><body><header><a class="logo" href="index.html">TrendCart</a></header><main><div class="form"><h2>Checkout</h2><div id="summary"></div><div class="coupon-box" style="margin:16px 0;padding:14px;border:1px solid #ddd;border-radius:12px"><b>🎟️ Have a coupon?</b><div style="display:flex;gap:8px;margin-top:8px"><input id="coupon" placeholder="Enter coupon code" autocomplete="off"><button type="button" id="couponBtn">Apply</button></div><div id="couponMsg" class="muted" style="margin-top:6px"></div></div><form id="f"><input id="name" placeholder="Full Name" required><input id="email" type="email" placeholder="Email Address" autocomplete="email" required><small class="muted">Order confirmation will be sent to this email.</small><input id="mobile" placeholder="Mobile Number" inputmode="numeric" required><textarea id="address" placeholder="Full Address" required></textarea><input id="city" placeholder="City" required><input id="state" placeholder="State" required><div><input id="pin" placeholder="6-digit Pincode" inputmode="numeric" maxlength="6" required><div id="pinMsg" class="muted" style="margin-top:6px;min-height:20px"></div></div><select id="pay"><option value="COD">Cash on Delivery</option><option value="ONLINE">Online Payment (UPI / Card / Netbanking)</option></select><button id="placeBtn" type="submit">Place Order</button></form></div></main><script>const API='https://trendcart-wozq.onrender.com',K='trendcart_cart',c=JSON.parse(localStorage.getItem(K)||'[]'),summary=document.getElementById('summary'),form=document.getElementById('f'),btn=document.getElementById('placeBtn'),couponInput=document.getElementById('coupon'),couponBtn=document.getElementById('couponBtn'),couponMsg=document.getElementById('couponMsg'),pinInput=document.getElementById('pin'),pinMsg=document.getElementById('pinMsg');const subtotal=c.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0);let appliedCoupon='',discount=0,shipping=subtotal>=999?0:subtotal>0?49:0,pinChecked=false,pinAvailable=false;function renderSummary(){const discounted=Math.max(0,subtotal-discount);shipping=discounted>=999?0:discounted>0?49:0;const finalTotal=discounted+shipping;summary.innerHTML=`<p>${c.length} cart item(s)</p><div>Subtotal: ₹${subtotal.toFixed(2)}</div>${discount?`<div style="margin-top:5px">Discount: -₹${discount.toFixed(2)}</div>`:''}<div style="margin-top:5px">Shipping: ${shipping?'₹'+shipping.toFixed(2):'FREE'}</div><div class="total" style="margin-top:6px">Total: ₹${finalTotal.toFixed(2)}</div>${shipping?`<small class="muted">Free shipping on orders ₹999 or more.</small>`:'<small class="muted">🎉 You unlocked free shipping!</small>`} `}renderSummary();async function checkPincode(){const pin=pinInput.value.trim();pinChecked=false;pinAvailable=false;if(!/^\d{6}$/.test(pin)){pinMsg.textContent='Enter a valid 6-digit pincode.';return}pinMsg.textContent='Checking delivery availability...';try{const r=await fetch('https://api.postalpincode.in/pincode/'+encodeURIComponent(pin));const d=await r.json();const ok=Array.isArray(d)&&d[0]?.Status==='Success'&&Array.isArray(d[0]?.PostOffice)&&d[0].PostOffice.length>0;if(!ok)throw Error('Delivery is not available for this pincode.');const p=d[0].PostOffice[0];pinChecked=true;pinAvailable=true;pinMsg.textContent='✓ Delivery available — '+(p.District||p.Block||'your area')+', '+(p.State||'India');}catch(e){pinChecked=true;pinAvailable=false;pinMsg.textContent='✕ '+(e.message||'Unable to check pincode. Please try again.')}}pinInput.addEventListener('blur',checkPincode);pinInput.addEventListener('input',()=>{pinChecked=false;pinAvailable=false;pinMsg.textContent=''});async function applyCoupon(){const code=couponInput.value.trim();if(!code){couponMsg.textContent='Enter a coupon code';return}couponBtn.disabled=true;couponMsg.textContent='Checking coupon...';try{const r=await fetch(API+'/api/coupons/validate',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({code,subtotal})});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||'Coupon could not be applied');appliedCoupon=d.code;discount=Number(d.discount||0);shipping=Number(d.shipping||0);couponMsg.textContent=`✓ ${d.code} applied — You save ₹${discount.toFixed(2)}`;couponInput.disabled=true;couponBtn.textContent='Applied';renderSummary()}catch(err){appliedCoupon='';discount=0;couponMsg.textContent=err.message;renderSummary();couponBtn.disabled=false}}couponBtn.addEventListener('click',applyCoupon);function customerBody(){return{customer_name:document.getElementById('name').value.trim(),email:document.getElementById('email').value.trim(),mobile:document.getElementById('mobile').value.trim(),address:document.getElementById('address').value.trim(),city:document.getElementById('city').value.trim(),state:document.getElementById('state').value.trim(),pincode:document.getElementById('pin').value.trim(),items:c,total:Number((subtotal-discount+shipping).toFixed(2)),coupon_code:appliedCoupon||null}}function validate(body){const required=['customer_name','email','mobile','address','city','state','pincode'];const missing=required.filter(k=>!body[k]);if(missing.length){alert('Please fill: '+missing.join(', '));return false}if(!/^\S+@\S+\.\S+$/.test(body.email)){alert('Please enter a valid email address.');return false}if(!/^\d{6}$/.test(body.pincode)){alert('Please enter a valid 6-digit pincode.');return false}if(!pinChecked||!pinAvailable){alert('Please check delivery availability for your pincode before placing the order.');checkPincode();return false}return true}function saveConfirmation(body,orderId,payment_method,status='Pending',extra={}){sessionStorage.setItem('trendcart_last_order',JSON.stringify({...body,orderId,payment_method,status,discount,shipping:Number(extra.shipping??shipping)}))}async function placeCOD(body){const r=await fetch(API+'/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({...body,payment_method:'COD'})});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||'Order could not be placed');return d}async function startOnline(body){const r=await fetch(API+'/api/payment/create-order',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||'Could not start online payment');const options={key:d.keyId,amount:d.amount,currency:d.currency,name:'TrendCart',description:'TrendCart Order',order_id:d.orderId,prefill:{name:body.customer_name,contact:body.mobile,email:body.email},theme:{color:'#111827'},handler:async function(response){try{const vr=await fetch(API+'/api/payment/verify',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({...body,razorpay_order_id:response.razorpay_order_id,razorpay_payment_id:response.razorpay_payment_id,razorpay_signature:response.razorpay_signature})});const vd=await vr.json().catch(()=>({error:'Invalid server response'}));if(!vr.ok)throw Error(vd.error||'Payment verification failed');saveConfirmation(body,vd.orderId,'ONLINE','Pending',vd);localStorage.removeItem(K);location.href='order-confirmation.html'}catch(err){btn.disabled=false;btn.textContent='Place Order';alert('Payment received but order confirmation failed: '+err.message)}},modal:{ondismiss:function(){btn.disabled=false;btn.textContent='Place Order';alert('Online payment cancelled.')}}};const rp=new Razorpay(options);rp.on('payment.failed',function(resp){btn.disabled=false;btn.textContent='Place Order';alert('Payment failed: '+(resp.error?.description||'Please try again.'))});rp.open()}form.addEventListener('submit',async e=>{e.preventDefault();if(!c.length){alert('Cart is empty');return}const body=customerBody();if(!validate(body))return;btn.disabled=true;btn.textContent='Processing...';try{if(document.getElementById('pay').value==='COD'){const d=await placeCOD(body);saveConfirmation(body,d.orderId,'COD',d.status||'Pending',d);localStorage.removeItem(K);location.href='order-confirmation.html'}else await startOnline(body)}catch(err){btn.disabled=false;btn.textContent='Place Order';alert('Order failed: '+err.message)}});</script></body></html>
