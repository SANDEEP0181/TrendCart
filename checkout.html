<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - TrendCart</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="logo" href="index.html">TrendCart</a></header>
<main>
  <div class="form">
    <h2>Checkout</h2>
    <div id="summary"></div>
    <form id="f">
      <input id="name" placeholder="Full Name" required>
      <input id="mobile" placeholder="Mobile Number" required>
      <textarea id="address" placeholder="Full Address" required></textarea>
      <input id="city" placeholder="City" required>
      <input id="state" placeholder="State" required>
      <input id="pin" placeholder="Pincode" required>
      <select id="pay"><option value="COD">Cash on Delivery</option></select>
      <button type="submit">Place Order</button>
    </form>
  </div>
</main>
<script>
const API='https://trendcart-wozq.onrender.com';
const K='trendcart_cart';
const c=JSON.parse(localStorage.getItem(K)||'[]');
const summary=document.getElementById('summary');
const form=document.getElementById('f');
const total=c.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0);
summary.innerHTML=`<p>${c.length} cart item(s)</p><div class="total">Total: ₹${total}</div>`;

form.addEventListener('submit',async e=>{
  e.preventDefault();
  if(!c.length){alert('Cart is empty');return;}

  const body={
    customer_name:document.getElementById('name').value.trim(),
    mobile:document.getElementById('mobile').value.trim(),
    address:document.getElementById('address').value.trim(),
    city:document.getElementById('city').value.trim(),
    state:document.getElementById('state').value.trim(),
    pincode:document.getElementById('pin').value.trim(),
    payment_method:document.getElementById('pay').value,
    items:c,
    total:Number(total)
  };

  const required=['customer_name','mobile','address','city','state','pincode','payment_method'];
  const missing=required.filter(k=>!body[k]);
  if(missing.length){alert('Please fill: '+missing.join(', '));return;}

  try{
    const r=await fetch(API+'/api/orders',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify(body)
    });
    const d=await r.json().catch(()=>({error:'Invalid server response'}));
    if(!r.ok) throw Error(d.error||'Order could not be placed');
    localStorage.removeItem(K);
    alert('Order placed successfully! Order ID: #'+d.orderId);
    location.href='index.html';
  }catch(err){
    alert('Order failed: '+err.message);
  }
});
</script>
</body>
</html>
