<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TrendCart customer account and order history"><title>My Account - TrendCart</title><link rel="stylesheet" href="style.css"><style>.account-wrap{max-width:1000px;margin:28px auto;padding:0 16px}.account-grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.05)}.profile-card{text-align:center}.avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;background:#eef4ff;font-size:30px}.muted{color:#667085}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.stat{padding:12px;border:1px solid #eaecf0;border-radius:12px;text-align:center}.stat b{display:block;font-size:20px}.order{border:1px solid #e4e7ec;border-radius:14px;padding:15px;margin:12px 0}.order-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:5px 9px;border-radius:999px;background:#eef4ff;font-size:12px;font-weight:700}.filters{display:grid;grid-template-columns:1fr 180px;gap:8px}.button{display:inline-block;text-decoration:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:35px}.notice{padding:10px 12px;border-radius:10px;background:#fffaeb;margin:10px 0;font-size:13px}@media(max-width:700px){.account-grid{grid-template-columns:1fr}.filters{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}}</style></head><body><header><a class="logo" href="index.html">TrendCart</a><nav><a href="index.html">Shop</a><a href="track-order.html">Track Order</a><a href="wishlist.html">Wishlist</a><a href="cart.html">Cart</a></nav></header><main class="account-wrap"><div id="message" class="muted" style="min-height:24px"></div><section id="auth" class="panel" style="max-width:500px;margin:auto"><h2>👤 My Account</h2><p class="muted">Login or create your TrendCart account to view orders.</p><input id="name" placeholder="Full Name"><input id="email" type="email" placeholder="Email Address" autocomplete="email"><input id="mobile" placeholder="Mobile Number" inputmode="numeric"><input id="password" type="password" placeholder="Password (minimum 8 characters)" autocomplete="current-password"><div class="actions"><button id="action">Create Account</button><button id="toggle" type="button">Already have an account? Login</button></div></section><section id="account" style="display:none"><div class="account-grid"><aside><div class="panel profile-card"><div class="avatar">👤</div><h2 id="pname">Customer</h2><p id="pemail" class="muted"></p><p id="pmobile" class="muted"></p><button id="logout" type="button">Logout</button></div></aside><div><div class="panel"><div class="order-head"><div><h2 style="margin:0">📦 My Orders</h2><p class="muted" style="margin:5px 0">Your complete TrendCart order history</p></div><button onclick="loadOrders()">↻ Refresh</button></div><div class="stats"><div class="stat"><b id="totalOrders">0</b><span class="muted">Orders</span></div><div class="stat"><b id="delivered">0</b><span class="muted">Delivered</span></div><div class="stat"><b id="spent">₹0</b><span class="muted">Total Spent</span></div></div><div class="filters"><input id="search" placeholder="Search orders or products" oninput="renderOrders()"><select id="filter" onchange="renderOrders()"><option value="">All statuses</option><option>Pending</option><option>Confirmed</option><option>Processing</option><option>Shipped</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select></div><div id="orders"><div class="empty muted">Loading orders...</div></div></div></div></div></section></main><script>const API='https://trendcart-wozq.onrender.com',TK='trendcart_customer_token';let login=false,orders=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function setMsg(t,ok=false){$('message').textContent=t;$('message').style.color=ok?'green':''}function save(d){localStorage.setItem(TK,d.token);showAccount(d.customer)}function showAccount(c){$('auth').style.display='none';$('account').style.display='block';$('pname').textContent=c.name||'Customer';$('pemail').textContent=c.email||'';$('pmobile').textContent=c.mobile||'';setMsg('Logged in successfully.',true);loadOrders()}function renderOrders(){const q=($('search').value||'').trim().toLowerCase(),f=$('filter').value||'';const rows=orders.filter(o=>{let items=[];try{items=typeof o.items==='string'?JSON.parse(o.items):o.items||[]}catch(e){}const hay=[o.id,o.status,...items.map(i=>i.name)].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!f||String(o.status)===f)});$('orders').innerHTML=rows.length?rows.map(o=>{let items=[];try{items=typeof o.items==='string'?JSON.parse(o.items):o.items||[]}catch(e){}const can=['Pending','Confirmed'].includes(String(o.status));const refund=o.refund_status?'<div class="notice"><b>Refund:</b> '+esc(o.refund_status)+(o.refund_amount?' · ₹'+Number(o.refund_amount).toFixed(2):'')+'</div>':'';return '<article class="order"><div class="order-head"><b>Order #'+esc(o.id)+'</b><span class="badge">'+esc(o.status)+'</span></div><p class="muted">'+esc(o.created_at_ist||'')+'</p><p>'+items.map(i=>esc(i.name)+' × '+Number(i.quantity||0)+(i.size?' · Size '+esc(i.size):'')).join('<br>')+'</p><p><b>₹'+Number(o.total||0).toFixed(2)+'</b> · '+esc(o.payment_method)+'</p>'+refund+'<div class="actions"><a class="button" href="track-order.html?id='+encodeURIComponent(o.id)+'&mobile='+encodeURIComponent(o.mobile)+'">Track Order</a><a class="button" href="invoice.html?id='+encodeURIComponent(o.id)+'&mobile='+encodeURIComponent(o.mobile)+'">Invoice</a>'+(can?'<button type="button" onclick="cancelOrder('+Number(o.id)+')">Cancel Order</button>':'')+'</div></article>'}).join(''):'<div class="empty muted">No matching orders found.</div>'}async function loadOrders(){const t=localStorage.getItem(TK);if(!t)return;try{const r=await fetch(API+'/api/customer/orders',{headers:{Authorization:'Bearer '+t}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load orders');orders=d.orders||[];$('totalOrders').textContent=orders.length;$('delivered').textContent=orders.filter(o=>o.status==='Delivered').length;$('spent').textContent='₹'+orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+Number(o.total||0),0).toFixed(2);renderOrders()}catch(e){$('orders').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function cancelOrder(id){if(!confirm('Cancel order #'+id+'?'))return;const t=localStorage.getItem(TK);try{const r=await fetch(API+'/api/customer/orders/'+encodeURIComponent(id)+'/cancel',{method:'POST',headers:{Authorization:'Bearer '+t}}),d=await r.json();if(!r.ok)throw Error(d.error||'Unable to cancel order');setMsg(d.refundRequested?'Order cancelled. Refund request is Pending.':'Order cancelled successfully.',true);loadOrders()}catch(e){setMsg(e.message)}}$('toggle').onclick=()=>{login=!login;$('name').style.display=login?'none':'';$('mobile').style.display=login?'none':'';$('password').value='';$('action').textContent=login?'Login':'Create Account';$('toggle').textContent=login?'New customer? Create account':'Already have an account? Login';setMsg('')};$('action').onclick=async()=>{const body=login?{email:$('email').value.trim(),password:$('password').value}:{name:$('name').value.trim(),email:$('email').value.trim(),mobile:$('mobile').value.trim(),password:$('password').value};$('action').disabled=true;setMsg(login?'Signing in...':'Creating account...');try{const r=await fetch(API+(login?'/api/customer/login':'/api/customer/register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');save(d)}catch(e){setMsg(e.message)}finally{$('action').disabled=false}};$('logout').onclick=()=>{localStorage.removeItem(TK);location.reload()};async function check(){const t=localStorage.getItem(TK);if(!t)return;try{const r=await fetch(API+'/api/customer/me',{headers:{Authorization:'Bearer '+t}}),d=await r.json();if(r.ok)showAccount(d.customer);else localStorage.removeItem(TK)}catch(e){}}check();</script></body></html>
