<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice - TrendCart</title><link rel="stylesheet" href="style.css"><style>body{background:#f5f7fb}.invoice{max-width:800px;margin:24px auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}.inv-head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #111827;padding-bottom:20px}.inv-head h1{margin:0}.meta{text-align:right}.customer,.totals{margin-top:22px}.customer p{margin:5px 0}.items{width:100%;border-collapse:collapse;margin-top:12px}.items th,.items td{padding:10px 8px;border-bottom:1px solid #e5e7eb;text-align:left}.items th:last-child,.items td:last-child{text-align:right}.totals{margin-left:auto;max-width:320px}.total-row{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:20px;font-weight:800;border-top:2px solid #111827;margin-top:5px;padding-top:10px}.actions{display:flex;justify-content:center;gap:12px;margin-top:28px}.actions button,.actions a{padding:11px 18px;border:0;border-radius:9px;text-decoration:none;background:#111827;color:#fff;cursor:pointer}.actions .secondary{background:#e5e7eb;color:#111827}.error{text-align:center;padding:30px}@media print{body{background:#fff}.invoice{box-shadow:none;margin:0;max-width:none}.actions{display:none}}@media(max-width:600px){.invoice{margin:10px;padding:18px}.inv-head{flex-direction:column}.meta{text-align:left}.items{font-size:13px}.items th,.items td{padding:7px 3px}}</style></head><body><main class="invoice" id="invoice"><div id="content"><div class="error">Loading invoice...</div></div></main><script>const API='https://trendcart-wozq.onrender.com';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const q=new URLSearchParams(location.search);const id=Number(q.get('id')),mobile=(q.get('mobile')||'').trim();async function load(){if(!Number.isInteger(id)||id<1||!mobile)return document.getElementById('content').innerHTML='<div class="error"><h2>Invoice not found</h2><p>Valid Order ID and mobile number are required.</p></div>';try{const r=await fetch(API+'/api/orders/track?id='+encodeURIComponent(id)+'&mobile='+encodeURIComponent(mobile));const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load invoice');const o=d.order,items=Array.isArray(o.items)?o.items:[];const subtotal=items.reduce((s,x)=>s+Number(x.price||0)*Number(x.quantity||0),0);const discount=Math.max(0,subtotal-Number(o.total||0));document.getElementById('content').innerHTML=`<div class="inv-head"><div><h1>TrendCart</h1><p>Simple shopping. Trending choices.</p></div><div class="meta"><b>INVOICE</b><br>Order #${esc(o.id)}<br>${esc(o.created_at_ist||'')}</div></div><div class="customer"><h3>Customer Details</h3><p><b>Name:</b> ${esc(o.customer_name)}</p><p><b>Mobile:</b> ${esc(o.mobile)}</p><p><b>Address:</b> ${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pincode)}</p><p><b>Payment:</b> ${esc(o.payment_method==='ONLINE'?'Online Payment':'Cash on Delivery')}</p><p><b>Status:</b> ${esc(o.status)}</p></div><table class="items"><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Amount</th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.name||'Product')}${x.size?' · Size '+esc(x.size):''}</td><td>${Number(x.quantity||0)}</td><td>₹${Number(x.price||0).toFixed(2)}</td><td>₹${(Number(x.price||0)*Number(x.quantity||0)).toFixed(2)}</td></tr>`).join('')}</tbody></table><div class="totals"><div class="total-row"><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>${discount>0?`<div class="total-row"><span>Discount</span><span>-₹${discount.toFixed(2)}</span></div>`:''}<div class="total-row"><span>Shipping</span><span>₹0.00</span></div><div class="total-row grand"><span>Grand Total</span><span>₹${Number(o.total||0).toFixed(2)}</span></div></div><div class="actions"><button onclick="print()">🖨️ Print / Save PDF</button><a class="secondary" href="track-order.html?id=${encodeURIComponent(o.id)}&mobile=${encodeURIComponent(o.mobile)}">Track Order</a><a class="secondary" href="index.html">Shop More</a></div>`}catch(e){document.getElementById('content').innerHTML='<div class="error"><h2>Unable to load invoice</h2><p>'+esc(e.message)+'</p></div>'}}load();</script></body></html>
