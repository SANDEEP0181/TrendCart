<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="TrendCart customer reviews and ratings."><title>Customer Reviews & Ratings - TrendCart</title><link rel="stylesheet" href="style.css?v=20260907-7"><style>.review-page{max-width:1100px}.review-summary{display:grid;grid-template-columns:220px 1fr;gap:18px;margin:22px 0}.rating-overview,.rating-bars,.review-toolbar,.review-form-card{background:#fff;border:1px solid #eef0f5;border-radius:16px;padding:18px;box-shadow:0 6px 24px #10182812}.big-rating{font-size:38px;font-weight:800}.stars{letter-spacing:2px;color:#f59e0b;font-size:20px}.bar-row{display:grid;grid-template-columns:55px 1fr 35px;gap:8px;align-items:center;margin:8px 0;font-size:13px}.bar{height:8px;background:#eef0f5;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#f59e0b}.review-toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.review-toolbar select{padding:10px;border:1px solid #d9dce5;border-radius:9px;background:#fff}.star-picker{display:flex;gap:5px;margin:6px 0 12px}.star-picker button{background:#fff!important;color:#98a2b3!important;border:1px solid #d9dce5!important;padding:7px 10px!important;min-height:40px;font-size:21px}.star-picker button.active{color:#f59e0b!important;border-color:#f59e0b!important}.review-card{position:relative}.review-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.helpful{margin-top:10px;background:#fff!important;color:#344054!important;border:1px solid #d9dce5!important;font-size:12px;padding:8px 10px!important}.product-title{color:#5965d8;font-weight:700}.empty-review{padding:35px;text-align:center}@media(max-width:650px){.review-summary{grid-template-columns:1fr}.review-toolbar{align-items:stretch;flex-direction:column}.review-toolbar select{width:100%}.review-meta{align-items:flex-start;flex-direction:column}.bar-row{grid-template-columns:45px 1fr 30px}.review-form-card{padding:14px}}</style></head><body><header><a class="logo" href="index.html" aria-label="TrendCart home">TrendCart</a><nav><a href="index.html">Shop</a><a href="track-order.html">Track Order</a><a href="cart.html">🛒 Cart</a></nav></header><main class="review-page"><section class="review-form-card"><span class="eyebrow">CUSTOMER FEEDBACK</span><h1>⭐ Reviews & Ratings</h1><p class="muted">Share your experience with a TrendCart product.</p><label>Product ID<input id="productId" type="number" min="1" placeholder="Enter Product ID" required></label><label>Your Name<input id="name" maxlength="80" placeholder="Your Name" required></label><label>Your Rating</label><div id="starPicker" class="star-picker" role="radiogroup" aria-label="Choose rating"></div><textarea id="comment" maxlength="500" rows="5" placeholder="Write your review (up to 500 characters)..." required></textarea><button id="submit" type="button">Submit Review</button><div id="msg" class="muted" style="margin-top:12px"></div></section><section><div class="review-summary"><div class="rating-overview"><div class="big-rating" id="avg">0.0</div><div id="avgStars" class="stars">☆☆☆☆☆</div><div id="total" class="muted">0 reviews</div></div><div class="rating-bars" id="bars"></div></div><div class="review-toolbar"><b id="reviewHeading">Customer Reviews</b><select id="sort"><option value="newest">Newest first</option><option value="highest">Highest rated</option><option value="lowest">Lowest rated</option><option value="helpful">Most helpful</option></select></div><div id="reviews" class="grid"></div></section></main><footer><b>TrendCart</b><span>Simple shopping. Trending choices.</span></footer><script>const K='trendcart_reviews',H='trendcart_review_helpful';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const all=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return[]}};const helpful=()=>{try{return JSON.parse(localStorage.getItem(H)||'{}')}catch{return{}}};const save=a=>localStorage.setItem(K,JSON.stringify(a));const pid=new URLSearchParams(location.search).get('product')||'';productId.value=pid;let selected=5;const picker=document.getElementById('starPicker');for(let i=1;i<=5;i++){const b=document.createElement('button');b.type='button';b.textContent='★';b.setAttribute('aria-label',i+' star');b.onclick=()=>{selected=i;updatePicker()};picker.appendChild(b)}function updatePicker(){[...picker.children].forEach((b,i)=>b.classList.toggle('active',i<selected))}updatePicker();function filtered(){const id=productId.value.trim();return all().filter(x=>!id||String(x.product_id)===id)}function summary(a){const total=a.length,avg=total?a.reduce((s,x)=>s+Number(x.rating||0),0)/total:0;document.getElementById('avg').textContent=avg.toFixed(1);document.getElementById('avgStars').textContent='★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg));document.getElementById('total').textContent=total+' review'+(total===1?'':'s');const b=document.getElementById('bars');b.innerHTML=[5,4,3,2,1].map(n=>{const c=a.filter(x=>Number(x.rating)===n).length,p=total?Math.round(c/total*100):0;return `<div class="bar-row"><span>${n} ★</span><div class="bar"><i style="width:${p}%"></i></div><span>${c}</span></div>`}).join('')}function load(){let a=filtered(),h=helpful(),s=document.getElementById('sort').value;if(s==='highest')a.sort((x,y)=>Number(y.rating)-Number(x.rating));if(s==='lowest')a.sort((x,y)=>Number(x.rating)-Number(y.rating));if(s==='helpful')a.sort((x,y)=>(h[y.review_id]||0)-(h[x.review_id]||0));summary(a);document.getElementById('reviewHeading').textContent=productId.value?`Reviews for Product #${esc(productId.value)}`:'Customer Reviews';const g=document.getElementById('reviews');g.innerHTML=a.length?a.map((x,i)=>{const id=x.review_id||`${x.product_id}-${x.created_at}-${i}`,votes=h[id]||0;return `<article class="card review-card"><div class="review-meta"><div><b>${esc(x.customer_name||'Customer')}</b><div class="stars">${'★'.repeat(Number(x.rating))}${'☆'.repeat(5-Number(x.rating))}</div></div><small class="muted">${esc(x.created_at||'')}</small></div><div class="product-title">Product #${esc(x.product_id)}</div><p>${esc(x.comment)}</p><button class="helpful" type="button" onclick="vote('${esc(id)}')">👍 Helpful (${votes})</button></article>`}).join(''):'<div class="empty-review"><div class="empty-icon">⭐</div><h3>No reviews yet</h3><p class="muted">Be the first customer to share your experience!</p></div>'}function vote(id){const h=helpful();h[id]=(h[id]||0)+1;localStorage.setItem(H,JSON.stringify(h));load()}submit.onclick=()=>{const id=Number(productId.value),n=name.value.trim(),c=comment.value.trim();if(!id||!n||!c){msg.textContent='Please fill Product ID, name and review.';return}const a=all();a.unshift({review_id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),product_id:id,product_name:'Product #'+id,customer_name:n,rating:selected,comment:c,created_at:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})});save(a);msg.textContent='✓ Review submitted successfully';name.value='';comment.value='';selected=5;updatePicker();load()};productId.addEventListener('input',load);sort.addEventListener('change',load);load()</script></body></html>
