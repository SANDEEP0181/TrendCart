<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Reviews - TrendCart</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">TrendCart</a><nav><a href="index.html">Shop</a><a href="cart.html">🛒 Cart</a></nav></header><main><div class="form"><h2>⭐ Product Reviews</h2><p class="muted">Share your experience with a TrendCart product.</p><input id="productId" type="number" min="1" placeholder="Product ID" required><input id="name" maxlength="80" placeholder="Your Name" required><select id="rating"><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select><textarea id="comment" maxlength="500" placeholder="Write your review..."></textarea><button id="submit">Submit Review</button><div id="msg" class="muted" style="margin-top:12px"></div></div><section><h2>Latest Reviews</h2><div id="reviews" class="grid"><p class="loading">Loading reviews...</p></div></section></main><script>const API='https://trendcart-wozq.onrender.com';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){try{const r=await fetch(API+'/api/reviews');const d=await r.json();if(!r.ok)throw Error(d.error);document.getElementById('reviews').innerHTML=d.length?d.map(x=>`<article class="card"><h3>${esc(x.product_name)}</h3><div>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div><b>${esc(x.customer_name)}</b><p>${esc(x.comment||'')}</p><small class="muted">${esc(x.created_at)}</small></article>`).join(''):'<p class="loading">No reviews yet.</p>'}catch(e){document.getElementById('reviews').innerHTML='<p class="loading">Reviews load नहीं हो पाए.</p>'}}document.getElementById('submit').onclick=async()=>{const body={product_id:Number(productId.value),customer_name:name.value.trim(),rating:Number(rating.value),comment:comment.value.trim()};if(!body.product_id||!body.customer_name||!body.comment){msg.textContent='Please fill all fields.';return}try{const r=await fetch(API+'/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent='✓ Review submitted successfully';name.value='';comment.value='';load()}catch(e){msg.textContent=e.message}};load()</script></body></html>
