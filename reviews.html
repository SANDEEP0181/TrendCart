<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Reviews - TrendCart</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">TrendCart</a><nav><a href="index.html">Shop</a><a href="cart.html">🛒 Cart</a></nav></header><main><div class="form"><h2>⭐ Product Reviews</h2><p class="muted">Share your experience with a TrendCart product.</p><input id="productId" type="number" min="1" placeholder="Product ID" required><input id="name" maxlength="80" placeholder="Your Name" required><select id="rating"><option value="5">★★★★★ — 5</option><option value="4">★★★★☆ — 4</option><option value="3">★★★☆☆ — 3</option><option value="2">★★☆☆☆ — 2</option><option value="1">★☆☆☆☆ — 1</option></select><textarea id="comment" maxlength="500" placeholder="Write your review..." required></textarea><button id="submit">Submit Review</button><div id="msg" class="muted" style="margin-top:12px"></div></div><section><h2>Reviews</h2><div id="reviews" class="grid"></div></section></main><script>const K='trendcart_reviews';const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const all=()=>JSON.parse(localStorage.getItem(K)||'[]');const save=a=>localStorage.setItem(K,JSON.stringify(a));const pid=new URLSearchParams(location.search).get('product')||'';if(pid)productId.value=pid;function load(){const id=productId.value.trim();const a=all().filter(x=>!id||String(x.product_id)===id);reviews.innerHTML=a.length?a.map(x=>`<article class="card"><h3>${esc(x.product_name||'Product #'+x.product_id)}</h3><div>${'★'.repeat(x.rating)}${'☆'.repeat(5-x.rating)}</div><b>${esc(x.customer_name)}</b><p>${esc(x.comment)}</p><small class="muted">${esc(x.created_at)}</small></article>`).join(''):'<p class="loading">No reviews yet. Be the first to review!</p>'}submit.onclick=()=>{const id=Number(productId.value),n=name.value.trim(),r=Number(rating.value),c=comment.value.trim();if(!id||!n||!c){msg.textContent='Please fill all fields.';return}const a=all();a.unshift({product_id:id,product_name:'Product #'+id,customer_name:n,rating:r,comment:c,created_at:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})});save(a);msg.textContent='✓ Review submitted successfully';name.value='';comment.value='';load()};productId.addEventListener('change',load);load()</script></body></html>
