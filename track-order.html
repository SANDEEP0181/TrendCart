<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Track your TrendCart order."><title>Track Order - TrendCart</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="logo" href="index.html">TrendCart</a><nav><a href="index.html">Shop</a><a href="cart.html">🛒 Cart</a></nav></header>
<main><div class="form" style="max-width:680px;margin:40px auto"><span class="eyebrow">ORDER TRACKING</span><h2>Track Your Order</h2><p>Enter your Order ID and the mobile number used at checkout.</p><form id="trackForm"><input id="orderId" type="number" min="1" placeholder="Order ID" required><input id="mobile" type="tel" inputmode="numeric" placeholder="Mobile Number" required><button class="btn" type="submit">Track Order</button></form><div id="result" style="margin-top:24px"></div></div></main>
<footer><b>TrendCart</b><span>Simple shopping. Trending choices.</span></footer>
<script>
const API='https://trendcart-wozq.onrender.com';const result=document.getElementById('result');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function money(v){return '₹'+Number(v||0).toFixed(2)}
const steps=['Pending','Confirmed','Processing','Shipped','Out for Delivery','Delivered'];
const labels={Pending:'Order Placed',Confirmed:'Confirmed',Processing:'Processing',Shipped:'Shipped', 'Out for Delivery':'Out for Delivery',Delivered:'Delivered'};
function timeline(status){if(status==='Cancelled')return '<div style="margin:18px 0;padding:16px;border-radius:12px;background:#fff1f1;color:#b00020;font-weight:700">❌ Order Cancelled</div>';const idx=Math.max(0,steps.indexOf(status));return `<div style="margin:22px 0;padding:20px;border:1px solid #e5e7eb;border-radius:16px;background:#fafbff"><h4 style="margin:0 0 18px">Delivery Progress</h4><div style="display:grid;gap:12px">${steps.map((s,i)=>{const done=i<=idx;const current=i===idx;return `<div style="display:flex;align-items:center;gap:12px"><div style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid ${done?'#111':'#d1d5db'};background:${done?'#111':'#fff'};color:${done?'#fff':'#777'};font-weight:700">${done?'✓':i+1}</div><div><b>${labels[s]}</b>${current?'<div style="font-size:13px;color:#666;margin-top:2px">Current status</div>':''}</div></div>`}).join('')}</div></div>`}
document.getElementById('trackForm').addEventListener('submit',async e=>{e.preventDefault();result.innerHTML='<p>🔎 Finding your order...</p>';const id=document.getElementById('orderId').value.trim(),mobile=document.getElementById('mobile').value.trim();try{const r=await fetch(`${API}/api/orders/track?id=${encodeURIComponent(id)}&mobile=${encodeURIComponent(mobile)}`);const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d.error||'Order not found');const o=d.order;const items=Array.isArray(o.items)?o.items:[];result.innerHTML=`<div style="padding:20px;border:1px solid #ddd;border-radius:14px;background:#fff"><h3 style="margin-bottom:6px">Order #${esc(o.id)}</h3><p><b>Status:</b> ${esc(o.status)}</p>${timeline(o.status)}<p><b>Order Date:</b> ${esc(o.created_at_ist)}</p><p><b>Payment:</b> ${esc(o.payment_method)}</p><hr><h4>Items</h4>${items.map(i=>`<p>${esc(i.name)}${i.size?' ('+esc(i.size)+')':''} × ${esc(i.quantity)} — ${money(i.price*i.quantity)}</p>`).join('')}<hr><h3>Total: ${money(o.total)}</h3><p><b>Delivery:</b> ${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pincode)}</p></div>`}catch(err){result.innerHTML=`<p style="padding:14px;border-radius:10px;background:#fff1f1">❌ ${esc(err.message)}</p>`}});
</script></body></html>
