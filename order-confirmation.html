<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed - TrendCart</title><link rel="stylesheet" href="style.css"><style>body{background:#f7f8fc}.confirm{max-width:760px;margin:40px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}.success{font-size:54px;text-align:center;color:#16a34a}.center{text-align:center}.order-id{font-size:24px;font-weight:800;margin:10px 0}.box{background:#f7f7f7;border-radius:12px;padding:16px;margin-top:18px}.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #e5e5e5}.items{margin:10px 0;padding:0;list-style:none}.items li{display:flex;justify-content:space-between;padding:8px 0}.actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;background:#111827;color:#fff}.actions a.secondary{background:#e5e7eb;color:#111827}.error{background:#fff1f2;color:#991b1b;border:1px solid #fecdd3;border-radius:10px;padding:14px;margin-top:18px}@media(max-width:600px){.confirm{margin:20px 12px;padding:20px}.row{flex-direction:column;gap:3px}}</style></head><body><header><a class="logo" href="index.html">TrendCart</a></header><main><section class="confirm"><div class="success">✓</div><div class="center"><h1>Order Confirmed!</h1><p>Thank you for shopping with TrendCart.</p><div class="order-id" id="orderId">Loading order...</div></div><div class="box" id="details"></div><div id="error" class="error" hidden></div><div class="actions"><a id="track" href="track-order.html">Track Order</a><a id="invoice" href="#">🧾 Invoice</a><a class="secondary" href="index.html">Continue Shopping</a></div></section></main><script>(function(){try{const raw=sessionStorage.getItem('trendcart_last_order');const orderId=document.getElementById('orderId');const details=document.getElementById('details');const error=document.getElementById('error');const esc=v=>String(v==null?'':v).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]});if(!raw){orderId.textContent='Order details unavailable';details.innerHTML='<p>Your order may still have been created. Use Track Order to check it.</p>';return}const o=JSON.parse(raw);orderId.textContent='Order #'+esc(o.orderId);const items=Array.isArray(o.items)?o.items:[];details.innerHTML='<div class="row"><strong>Status</strong><span>'+esc(o.status||'Pending')+'</span></div><div class="row"><strong>Payment</strong><span>'+esc(o.payment_method==='ONLINE'?'Online Payment':'Cash on Delivery')+'</span></div><div class="row"><strong>Customer</strong><span>'+esc(o.customer_name)+'</span></div><div class="row"><strong>Mobile</strong><span>'+esc(o.mobile)+'</span></div><div><strong>Items</strong><ul class="items">'+items.map(function(x){return '<li><span>'+esc(x.name||'Product')+' × '+Number(x.quantity||1)+'</span><strong>₹'+(Number(x.price||0)*Number(x.quantity||1)).toFixed(2)+'</strong></li>'}).join('')+'</ul></div><div class="row"><strong>Total</strong><strong>₹'+Number(o.total||0).toFixed(2)+'</strong></div><div class="row"><strong>Delivery Address</strong><span>'+esc(o.address)+', '+esc(o.city)+', '+esc(o.state)+' - '+esc(o.pincode)+'</span></div>';const track='track-order.html?id='+encodeURIComponent(o.orderId)+'&mobile='+encodeURIComponent(o.mobile);document.getElementById('track').href=track;document.getElementById('invoice').href='invoice.html?id='+encodeURIComponent(o.orderId)+'&mobile='+encodeURIComponent(o.mobile)}catch(e){document.getElementById('orderId').textContent='Order confirmation';document.getElementById('details').innerHTML='<p>The order was submitted, but the confirmation details could not be displayed.</p>';const er=document.getElementById('error');er.hidden=false;er.textContent='Please use Track Order with your Order ID and mobile number.';}})();</script></body></html>
