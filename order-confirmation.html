<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed - TrendCart</title><link rel="stylesheet" href="style.css"><style>
.confirm{max-width:760px;margin:40px auto;padding:28px;background:#fff;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.success{font-size:46px;text-align:center}.center{text-align:center}.order-id{font-size:24px;font-weight:800;margin:10px 0}.box{background:#f7f7f7;border-radius:12px;padding:16px;margin-top:18px}.row{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid #e5e5e5}.row:last-child{border-bottom:0}.items{margin:10px 0 0;padding:0;list-style:none}.items li{display:flex;justify-content:space-between;padding:8px 0}.actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}.actions a{display:inline-block;text-decoration:none;padding:12px 18px;border-radius:10px;background:#111827;color:#fff}.actions a.secondary{background:#e5e7eb;color:#111827}@media(max-width:600px){.confirm{margin:20px 12px;padding:20px}.row{flex-direction:column;gap:3px}}
</style></head>
<body>
<header><a class="logo" href="index.html">TrendCart</a></header>
<main><section class="confirm">
  <div class="success">✓</div><div class="center"><h1>Order Confirmed!</h1><p>Thank you for shopping with TrendCart.</p><div class="order-id" id="orderId"></div></div>
  <div class="box" id="details"></div>
  <div class="actions"><a id="track" href="track-order.html">Track Order</a><a class="secondary" href="index.html">Continue Shopping</a></div>
</section></main>
<script>
const raw=sessionStorage.getItem('trendcart_last_order');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
if(!raw){document.getElementById('orderId').textContent='Order details unavailable';document.getElementById('details').innerHTML='<p>Please use Track Order to view your order.</p>'}else{
 const o=JSON.parse(raw);document.getElementById('orderId').textContent='Order #'+esc(o.orderId);
 const items=Array.isArray(o.items)?o.items:[];
 document.getElementById('details').innerHTML=`<div class="row"><strong>Status</strong><span>${esc(o.status||'Confirmed')}</span></div><div class="row"><strong>Payment</strong><span>${esc(o.payment_method==='ONLINE'?'Online Payment':'Cash on Delivery')}</span></div><div class="row"><strong>Customer</strong><span>${esc(o.customer_name)}</span></div><div class="row"><strong>Mobile</strong><span>${esc(o.mobile)}</span></div><div><strong>Items</strong><ul class="items">${items.map(x=>`<li><span>${esc(x.name||'Product')} × ${Number(x.quantity||1)}</span><strong>₹${(Number(x.price||0)*Number(x.quantity||1)).toFixed(2)}</strong></li>`).join('')}</ul></div><div class="row"><strong>Total</strong><strong>₹${Number(o.total||0).toFixed(2)}</strong></div><div class="row"><strong>Delivery Address</strong><span>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)} - ${esc(o.pincode)}</span></div>`;
 document.getElementById('track').href='track-order.html?id='+encodeURIComponent(o.orderId)+'&mobile='+encodeURIComponent(o.mobile);
}
</script></body></html>
