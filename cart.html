<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart - TrendCart</title><link rel="stylesheet" href="style.css"></head><body><header><a class="logo" href="index.html">TrendCart</a><nav><a href="index.html">Shop</a></nav></header><main><h2>Your Cart</h2><div id="cart"></div><div class="total" id="total"></div><a class="btn" href="checkout.html">Checkout</a></main><script>const K='trendcart_cart';function get(){return JSON.parse(localStorage.getItem(K)||'[]')}function save(c){localStorage.setItem(K,JSON.stringify(c));render()}function change(i,d){let c=get();c[i].quantity+=d;if(c[i].quantity<1)c.splice(i,1);save(c)}function removeItem(i){let c=get();c.splice(i,1);save(c)}function render(){let c=get(),box=document.getElementById('cart'),t=0;if(!c.length){box.innerHTML='<p>Your cart is empty.</p>';document.getElementById('total').textContent='';return}box.innerHTML=c.map((x,i)=>{let sub=x.price*x.quantity;t+=sub;return `<div class="card row"><div><b>${x.name}</b><div class="muted">Size: ${x.size||'N/A'}</div><div>₹${x.price} × ${x.quantity} = ₹${sub}</div></div><button onclick="change(${i},-1)">−</button><button onclick="change(${i},1)">+</button><button onclick="removeItem(${i})">Remove</button></div>`}).join('');document.getElementById('total').textContent='Total: ₹'+t}render()</script></body></html>
